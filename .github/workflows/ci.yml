name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Incremental artifacts only help repeated local edits; in the cache they
  # would grow it without speeding a new commit.
  CARGO_INCREMENTAL: '0'
  RUST_VERSION: '1.97.1'
  QT_VERSION: '6.11.2'

jobs:
  # Website, documentation, signed release metadata and a version-only release
  # preparation cannot change the application. They run the source lane on one
  # runner instead of building every platform. The release workflow builds and
  # qualifies its prepared commit itself.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lane: ${{ steps.scope.outputs.lane }}
    steps:
      - uses: actions/checkout@v4
      - name: Choose the lane for the changed paths
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # The checkout is shallow; the start of the range is fetched alone.
          # A start that cannot be fetched selects the desktop lane.
          if [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && ! "$BEFORE" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$BEFORE" || true
          fi
          python3 scripts/ci_scope.py --event "$EVENT_NAME" --before "$BEFORE" \
            --after "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  source:
    needs: scope
    if: ${{ needs.scope.outputs.lane == 'source' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate source without a build
        run: python3 scripts/verify.py --source

  desktop:
    needs: scope
    if: ${{ needs.scope.outputs.lane == 'desktop' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            target: aarch64-apple-darwin
            format: dmg
            bundle: build/macos/GitLama.app
            artifact: build/ci-artifacts/gitlama-macos.tar.gz
          - runner: ubuntu-24.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            format: tar.gz
            bundle: build/linux/bundle
            artifact: build/ci-artifacts/gitlama-linux.tar.gz
          - runner: windows-2025
            platform: windows
            target: x86_64-pc-windows-msvc
            format: msi
            bundle: build/windows/bundle
            artifact: build/ci-artifacts/gitlama-windows.zip
    runs-on: ${{ matrix.runner }}
    # Bounds a stalled dependency or Qt download.
    timeout-minutes: 120
    steps:
      - name: Free disk space for the Linux build
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Ensure Windows Git LFS
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          if (-not (Get-Command git-lfs -ErrorAction SilentlyContinue)) {
            choco install git-lfs --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Git LFS installation failed with exit code $LASTEXITCODE" }
          }
          git lfs version
          if ($LASTEXITCODE -ne 0) { throw "Git LFS validation failed with exit code $LASTEXITCODE" }
      - name: Install Linux desktop prerequisites
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang pkg-config patchelf git-lfs \
            libgl1-mesa-dev libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libfontconfig1 libdbus-1-3
      - name: Install Qt
        if: ${{ matrix.platform != 'windows' }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          setup-python: false
          modules: ${{ matrix.platform == 'linux' && 'qtwaylandcompositor' || '' }}
          cache: true
      # aqtinstall cannot read Qt 6.11's per-architecture Windows repository.
      - name: Install Qt on Windows
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          python scripts/install-qt-windows.py --version $env:QT_VERSION --output "$env:RUNNER_TEMP/Qt"
          if ($LASTEXITCODE -ne 0) { throw "Qt installation failed with exit code $LASTEXITCODE" }
      - name: Prepare Rust
        if: ${{ matrix.platform != 'windows' }}
        shell: bash
        run: |
          ./scripts/install-rustup-unix.sh
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy --target ${{ matrix.target }}
      - name: Prepare Rust on Windows
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          ./scripts/install-rustup-windows.ps1
          rustup toolchain install $env:RUST_VERSION --profile minimal --component rustfmt,clippy --target ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { throw "Rust toolchain setup failed with exit code $LASTEXITCODE" }
      # Rust builds reuse the previous run's output instead of compiling every
      # crate again; tests and packaging share rust-core/target.
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-core -> target
          key: ${{ matrix.platform }}-desktop
      - name: Resolve locked dependencies
        shell: bash
        run: cargo fetch --manifest-path rust-core/Cargo.toml --locked
      # Linux runs the full gate. QML lint, Python and formatting checks give
      # the same result everywhere, so macOS and Windows run only the Rust lints
      # and tests, the desktop build and the packaged smoke test.
      - name: Validate source
        if: ${{ matrix.platform != 'windows' }}
        shell: bash
        env:
          LANE: ${{ matrix.platform != 'linux' && '--platform' || '' }}
        run: python3 scripts/verify.py $LANE
      - name: Validate source on Windows
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . ./scripts/initialize-msvc-environment.ps1
          & ./tests/package/windows_quiescence_cases.ps1
          & ./tests/package/windows_soak_policy_cases.ps1
          python -m unittest discover -s tests/package -p test_windows_launch_probe.py
          if ($LASTEXITCODE -ne 0) { throw "Windows launch probe regressions failed" }
          # Fixture repositories compare exact bytes; append to any shared
          # dependency rewrite already configured.
          $n = if ($env:GIT_CONFIG_COUNT) { [int]$env:GIT_CONFIG_COUNT } else { 0 }
          Set-Item "env:GIT_CONFIG_KEY_$n" "core.autocrlf"
          Set-Item "env:GIT_CONFIG_VALUE_$n" "false"
          Set-Item "env:GIT_CONFIG_KEY_$($n + 1)" "core.eol"
          Set-Item "env:GIT_CONFIG_VALUE_$($n + 1)" "lf"
          $env:GIT_CONFIG_COUNT = "$($n + 2)"
          python scripts/verify.py --platform
          if ($LASTEXITCODE -ne 0) { throw "Source validation failed with exit code $LASTEXITCODE" }
      - name: Build desktop bundle
        if: ${{ matrix.platform != 'windows' }}
        shell: bash
        run: python3 scripts/package.py ${{ matrix.format }} --build-only
      - name: Build desktop bundle on Windows
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          . ./scripts/initialize-msvc-environment.ps1
          python scripts/package.py msi --build-only
          if ($LASTEXITCODE -ne 0) { throw "Desktop build failed with exit code $LASTEXITCODE" }
      - name: Render the first window from the bundle
        shell: bash
        run: python3 scripts/native-smoke.py "${{ matrix.bundle }}"
      # The release builds the Linux remote helper in the Ubuntu 22.04 container;
      # build it the same way here so a packaging break fails the pull request,
      # not the release.
      - name: Build the remote helper in the release container
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/qualify-linux-local.sh --remote-helper
      - name: Archive the bundle
        if: ${{ matrix.platform != 'windows' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${{ matrix.artifact }}")"
          tar -C "$(dirname "${{ matrix.bundle }}")" -czf "${{ matrix.artifact }}" \
            "$(basename "${{ matrix.bundle }}")"
      - name: Archive the bundle on Windows
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent "${{ matrix.artifact }}") | Out-Null
          Compress-Archive -LiteralPath "${{ matrix.bundle }}" -DestinationPath "${{ matrix.artifact }}" -CompressionLevel Fastest
          if (-not (Test-Path -LiteralPath "${{ matrix.artifact }}")) { throw "Bundle archive was not created" }
      - uses: actions/upload-artifact@v4
        with:
          name: gitlama-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
