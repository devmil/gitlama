# Deploys webfront/ to GitHub Pages. The release workflow calls it after it
# commits the signed release index, because pushes made with the workflow
# token do not start other workflows.
name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'webfront/**'
      - '.github/workflows/gitlama-pages.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The commit or branch whose webfront/ to deploy
        type: string
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Check website asset versions
        run: python3 scripts/generate_webfront_versions.py --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./webfront

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
