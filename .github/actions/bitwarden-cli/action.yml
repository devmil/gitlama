name: Bitwarden CLI
description: Installs the pinned Bitwarden CLI the release reads its Vaultwarden item with.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install the pinned Bitwarden CLI
      shell: bash
      run: |
        set -euo pipefail
        npm install --global --no-fund --no-audit @bitwarden/cli@2026.10.1 >/dev/null
        bw --version
        command -v jq >/dev/null
