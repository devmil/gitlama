[package]
name = "gitlama_core"
version = "0.1.0-beta.65"
edition = "2021"
rust-version = "1.97.1"
license = "MIT"
publish = false
description = "GitLama's desktop library: the flutter_rust_bridge facade and desktop-only services."

# Three layers and the headless remote helper share this lockfile:
# - contract (gitlama_contract): the bridge types, data only;
# - application (gitlama_application): domain, use cases and the remote wire adapter;
# - this package (gitlama_core): the FRB facade and desktop-only services, the library
#   Flutter loads;
# - remote-helper: the headless helper, built on the application crate alone.
# The Flutter build hook builds only this package, so the helper never enters the desktop
# bundle.
[workspace]
members = [".", "contract", "application", "remote-helper"]

[workspace.dependencies]
gitlama_contract = { path = "contract" }
gitlama_application = { path = "application", default-features = false }
devmil-git = { git = "https://github.com/devmil/devmil-rust-git", rev = "2867f4f064bb6adf7d308c9c7646a1d42722b3e9", features = ["hosting", "syntax-highlighting"] }
cap-std = "=4.0.2"
cap-primitives = "=4.0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "qoi"] }
resvg = { version = "=0.48.1", default-features = false }
roxmltree = { version = "=0.21.1" }
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
zeroize = { version = "=1.8.2" }
getrandom = "=0.3.3"
rustix = { version = "=1.1.4" }
nix = { version = "=0.29.0", default-features = false, features = ["socket", "user"] }
windows = { version = "=0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
devmil-logging = { git = "https://github.com/devmil/devmil-logging", rev = "aca7c46d78ed29e283bd01b6d3f43adb481cf297" }
flutter_rust_bridge = { version = "=2.13.0-beta.5" }
gitlama_contract = { workspace = true }
# The desktop library decodes images with the application's codecs.
gitlama_application = { workspace = true, features = ["image-codecs"] }
devmil-git = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
image = { workspace = true }
keyring = { workspace = true }
zeroize = { workspace = true }
getrandom = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["net", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[lints.rust]
# flutter_rust_bridge's `frb` attribute expands to this cfg.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }

[profile.release]
lto = true
# Keep crash symbols until the packaging step retains matching debug files.
codegen-units = 1
debug = 1
strip = false

# The Linux remote helper that debug application builds bundle: quick to build
# and small enough to upload, unlike a debug build with debug information.
[profile.helper-dev]
inherits = "dev"
debug = false
strip = true
