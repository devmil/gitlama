[package]
name = "gitlama_core"
version = "0.1.0-beta.68"
edition = "2021"
rust-version = "1.97.1"
license = "MIT"
publish = false
description = "GitLama's desktop library: the in-process facade and desktop-only services."

# The shared layers, the headless remote helper and the Qt desktop application share
# this lockfile:
# - contract (gitlama_contract): the bridge types, data only;
# - application (gitlama_application): domain, use cases and the remote wire adapter;
# - this package (gitlama_core): the in-process facade (`api`) and desktop-only services;
# - remote-helper: the headless helper, built on the application crate alone;
# - desktop/workbench: the desktop application's services (workspace, sessions,
#   history, changes, inspector, hosting, remote workspaces), independent of Qt;
# - desktop/qt: the Qt Bridges QObjects and item models;
# - desktop/app: the composition root and the `gitlama` executable.
# The helper never depends on the desktop crates, so it never enters the desktop bundle.
[workspace]
members = [
    ".",
    "contract",
    "application",
    "remote-helper",
    "desktop/workbench",
    "desktop/qt",
    "desktop/app",
]

[workspace.dependencies]
gitlama_core = { path = "." }
gitlama-workbench = { path = "desktop/workbench" }
gitlama-qt = { path = "desktop/qt" }
qtbridge = "=0.2.0"
futures = { version = "0.3", default-features = false, features = ["std", "executor", "async-await"] }
gitlama_contract = { path = "contract" }
gitlama_application = { path = "application", default-features = false }
devmil-git = { git = "https://github.com/devmil/devmil-rust-git", rev = "a8b30d995f2a1605b9c66fc41c29ab92e48be531", features = ["hosting", "syntax-highlighting"] }
cap-std = "=4.0.2"
cap-primitives = "=4.0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "qoi"] }
resvg = { version = "=0.48.1", default-features = false }
roxmltree = { version = "=0.21.1" }
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
zeroize = { version = "=1.8.2" }
getrandom = "=0.3.3"
rustix = { version = "=1.1.4" }
nix = { version = "=0.29.0", default-features = false, features = ["socket", "user"] }
windows = { version = "=0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[lib]
crate-type = ["rlib"]

[dependencies]
devmil-logging = { git = "https://github.com/devmil/devmil-logging", rev = "ddd8873c5f161574ad08757f0a9380fbcf2f5229" }
gitlama_contract = { workspace = true }
# The desktop library decodes images with the application's codecs.
gitlama_application = { workspace = true, features = ["image-codecs"] }
devmil-git = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
image = { workspace = true }
keyring = { workspace = true }
zeroize = { workspace = true }
getrandom = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["net", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[profile.release]
lto = true
# Keep crash symbols until the packaging step retains matching debug files.
codegen-units = 1
debug = 1
strip = false

# The Linux remote helper that debug application builds bundle: quick to build
# and small enough to upload, unlike a debug build with debug information.
[profile.helper-dev]
inherits = "dev"
debug = false
strip = true

# Fast local builds of the desktop app that still run like release.
[profile.dev-opt]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug = 1

[patch.crates-io]
qtbridge-interfaces = { path = "third_party/qtbridge-interfaces" }
