[package]
name = "gitlama-remote-helper"
# The helper is identified by the application source commit it was built from, not a version.
version = "0.0.0"
edition = "2021"
rust-version = "1.97.1"
license = "MIT"
publish = false

[[bin]]
name = "gitlama-remote-helper"
path = "src/main.rs"

[dependencies]
gitlama_application = { workspace = true }
serde_json = "1"
sha2 = "0.10"
getrandom = "=0.3.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process", "stdio"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
